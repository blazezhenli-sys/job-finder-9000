services:
  migrate:
    build: .
    restart: "no"
    env_file: .env
    command: ["node", "dist/migrate-entry.js"]
    environment:
      DB_POOL_MAX: "2"
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/server-entry.js"]
    environment:
      RUN_MIGRATIONS: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker-entry.js"]
    environment:
      DB_POOL_MAX: "${WORKER_DB_POOL_MAX:-6}"
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    ports:
      - ":1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
    depends_on:
      rsshub-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
  rsshub-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - rsshub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hiring
      POSTGRES_USER: hiring
      POSTGRES_PASSWORD: hiring
    volumes:
      - hiring-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiring -d hiring"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hiring-postgres:
  rsshub-redis-data:
