services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/server-entry.js"]
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker-entry.js"]
    environment:
      DB_POOL_MAX: "${WORKER_DB_POOL_MAX:-6}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hiring
      POSTGRES_USER: hiring
      POSTGRES_PASSWORD: hiring
    volumes:
      - hiring-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiring -d hiring"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hiring-postgres:
